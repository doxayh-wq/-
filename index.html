<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="압박노트">
<meta name="theme-color" content="#c8a96e">
<link rel="manifest" href="./manifest.json">
<title>좋은 글을 쓰고싶어하는 이들을 위한 안내서</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&family=Space+Mono:wght@400;700&display=swap');
  :root {
    --bg: #faf8f4;
    --paper: #ffffff;
    --ink: #1a1a18;
    --ink-mid: #3a3a36;
    --ink-dim: #888880;
    --accent: #b8924a;
    --accent-light: rgba(184,146,74,0.10);
    --danger: #c0392b;
    --safe: #2e7d52;
    --border: rgba(0,0,0,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overscroll-behavior:none; }
  body { background:var(--bg); color:var(--ink); font-family:'Noto Serif KR',serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }

  /* INTRO */
  #intro-screen { max-width:560px; width:100%; padding:56px 32px; animation:fadeIn .8s ease; text-align:center; }
  .book-label { font-family:'Space Mono',monospace; font-size:9px; letter-spacing:5px; color:var(--accent); text-transform:uppercase; margin-bottom:28px; }
  .book-title { font-size:clamp(1.4rem,5vw,2rem); font-weight:300; line-height:1.6; color:var(--ink); margin-bottom:48px; }
  .principle-box { border:1px solid rgba(184,146,74,0.35); padding:32px 28px; margin-bottom:48px; text-align:left; position:relative; background:var(--paper); }
  .principle-box::before { content:'좋은 글을 쓰는 법'; position:absolute; top:-10px; left:20px; background:var(--bg); padding:0 10px; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:3px; color:var(--accent); }
  .principle-text { font-size:15px; line-height:2.2; color:var(--ink); font-weight:400; }
  .principle-text strong { color:var(--accent); font-weight:700; }
  .start-btn { background:var(--accent); border:none; color:#fff; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:3px; padding:18px 48px; cursor:pointer; text-transform:uppercase; transition:opacity .2s; width:100%; }
  .start-btn:hover { opacity:.85; } .start-btn:active { opacity:.7; }

  /* WRITING */
  #writing-screen { display:none; width:100%; max-width:680px; padding:52px 28px 36px; min-height:100vh; flex-direction:column; animation:fadeIn .5s ease; }
  #timer-bar-wrap { position:fixed; top:0; left:0; right:0; height:4px; background:rgba(0,0,0,0.08); z-index:50; }
  #timer-bar { height:100%; background:var(--safe); width:100%; transition:width .1s linear,background .4s; }
  #word-box { margin-bottom:32px; padding:22px 24px; border-left:3px solid var(--accent); background:var(--accent-light); }
  .word-label { font-family:'Space Mono',monospace; font-size:9px; letter-spacing:4px; color:var(--accent); margin-bottom:10px; text-transform:uppercase; }
  #prompt-content { font-size:clamp(1.6rem,6vw,2.4rem); font-weight:700; color:var(--ink); line-height:1.3; }
  #prompt-content.is-def { font-size:clamp(14px,3.5vw,16px); font-weight:400; font-style:italic; color:var(--ink-mid); line-height:1.9; }
  #loading-prompt { font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-dim); animation:pulse 1s infinite; }
  #note-area { flex:1; width:100%; min-height:320px; background:transparent; border:none; outline:none; color:var(--ink); font-family:'Noto Serif KR',serif; font-size:clamp(16px,4vw,18px); line-height:2.1; resize:none; caret-color:var(--accent); }
  #note-area::placeholder { color:var(--ink-dim); opacity:.5; }
  #note-area:disabled { opacity:.5; cursor:not-allowed; }
  #timer-text { font-family:'Space Mono',monospace; font-size:11px; letter-spacing:1px; color:var(--ink-dim); margin-top:14px; text-align:right; }
  #timer-text.danger { color:var(--danger); animation:blink .5s infinite; }

  /* DEAD */
  #dead-screen { display:none; text-align:center; max-width:480px; width:100%; padding:48px 28px; animation:fadeIn .6s ease; flex-direction:column; align-items:center; }
  .dead-title { font-size:clamp(2rem,8vw,3rem); font-weight:700; color:var(--danger); margin-bottom:12px; }
  .dead-sub { font-size:13px; color:var(--ink-mid); margin-bottom:32px; font-family:'Space Mono',monospace; line-height:1.9; }
  .char-count { font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-dim); margin-bottom:28px; }
  .save-btn { background:var(--danger); border:none; color:white; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:3px; padding:16px 40px; cursor:pointer; text-transform:uppercase; transition:opacity .2s; display:block; width:100%; margin-bottom:10px; }
  .save-btn:hover { opacity:.85; }
  #save-confirm { font-family:'Space Mono',monospace; font-size:10px; color:var(--safe); min-height:18px; margin-bottom:18px; letter-spacing:1px; word-break:break-all; }
  .restart-btn { background:transparent; border:1px solid var(--border); color:var(--ink-mid); font-family:'Space Mono',monospace; font-size:11px; letter-spacing:2px; padding:14px 32px; cursor:pointer; text-transform:uppercase; transition:all .2s; width:100%; }
  .restart-btn:hover { border-color:var(--ink); color:var(--ink); }

  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
  #flash { position:fixed; inset:0; background:var(--danger); opacity:0; pointer-events:none; z-index:200; transition:opacity .1s; }
  #flash.show { opacity:.12; }
</style>

<style id="print-style">
  @media print {
    #intro-screen, #writing-screen, #dead-screen { display: none !important; }
    #print-page { display: block !important; }
    body { background: white; }
  }
</style>
</head>
<body>
<div id="flash"></div>

<!-- INTRO -->
<div id="intro-screen">
  <div class="book-label">안내서</div>
  <h1 class="book-title">좋은 글을 쓰고싶어하는<br>이들을 위한 안내서</h1>
  <div class="principle-box">
    <div class="principle-text">
      <strong>1. 단 쓰세요.</strong><br>
      못써도, 막써도, 잘쓰지 않아도<br>
      보는 사람은 나뿐입니다.<br><br>
      일단 쓰다보면 좋은 글을 쓰는 법을<br>
      알게될 뿐입니다.<br><br>
      남는건 글과 성장하는 나 뿐입니다.
    </div>
  </div>
  <button class="start-btn" onclick="startSession()">쓰기 시작하기</button>
</div>

<!-- WRITING -->
<div id="writing-screen">
  <div id="timer-bar-wrap"><div id="timer-bar"></div></div>
  <div id="word-box">
    <div class="word-label" id="prompt-label">불러오는 중</div>
    <div id="loading-prompt">잠시만요...</div>
    <div id="prompt-content" style="display:none"></div>
  </div>
  <textarea id="note-area" placeholder="여기에 자유롭게 써내려 가세요..." disabled></textarea>
  <div id="timer-text">대기 중</div>
</div>

<!-- DEAD -->
<div id="dead-screen">
  <div class="dead-title">펜이 멎었다</div>
  <p class="dead-sub">10초 동안 침묵이 흘렀습니다.<br>이제 이 순간은 영원히 고정됩니다.</p>
  <div class="char-count" id="final-chars"></div>
  <button class="save-btn" onclick="savePDF()">PDF로 저장하기</button>
  <div id="save-confirm"></div>
  <button class="restart-btn" onclick="restart()">다시 시작</button>
</div>

<script>
const WORD_DB = [
  // ── 감정·정서 ──
  {word:'서러움',definition:'억울하고 슬픈 감정. 말로 표현하기 어려운 마음의 응어리. 한국적 정서의 핵심에 있는 감각이다.'},
  {word:'여운',definition:'사라진 뒤에도 남아 맴도는 감각이나 감정. 음악이 끝난 후 공기에 남은 떨림 같은 것.'},
  {word:'그리움',definition:'없는 것을 있게 만드는 마음의 힘. 거리가 만들어내는 가장 강렬한 감각.'},
  {word:'설렘',definition:'무언가 좋은 일이 일어날 것 같은 예감. 가슴이 먼저 아는 기쁨.'},
  {word:'허전하다',definition:'무언가 빠져나간 자리에 남는 공백의 느낌. 채워지지 않는 텅 빔.'},
  {word:'쓸쓸하다',definition:'혼자 있는 것이 아니라, 혼자인 것이 느껴지는 상태. 고요함과 외로움의 교차점.'},
  {word:'두근거림',definition:'심장이 평소보다 빠르게 뛰는 감각. 기대와 불안이 공유하는 신체 언어.'},
  {word:'안도',definition:'걱정이 사라질 때 오는 가벼운 숨. 긴장이 풀리는 순간.'},
  {word:'외로움',definition:'혼자라는 것이 고통스럽게 느껴지는 상태. 연결을 원하는 마음의 신호.'},
  {word:'고독',definition:'혼자이면서 그것을 온전히 받아들이는 상태. 외로움과는 다르다.'},
  {word:'한(恨)',definition:'오랫동안 쌓인 억울함과 슬픔. 한국인의 정서 깊숙이 자리한, 풀리지 않은 응어리.'},
  {word:'정(情)',definition:'오랜 시간 함께하며 쌓이는 감정의 두께. 사랑도 아니고 우정도 아닌, 한국만의 결.'},
  {word:'공허',definition:'아무것도 없이 텅 빈 느낌. 무언가를 채워도 사라지지 않을 때가 있다.'},
  {word:'충만하다',definition:'가득 차 있는 상태. 더 이상 바랄 것이 없을 것 같은 순간.'},
  {word:'무기력',definition:'아무것도 하고 싶지 않은 상태. 에너지가 바닥났을 때 오는 신호.'},
  {word:'열정',definition:'무언가에 강하게 끌리는 에너지. 지속되면 사명이 된다.'},
  {word:'후회',definition:'이미 지나간 선택에 대한 아쉬움. 현재에서 과거를 바라보는 방식.'},
  {word:'기대',definition:'아직 오지 않은 것을 향한 설레는 마음. 미래를 현재로 당겨오는 힘.'},
  {word:'실망',definition:'기대했던 것이 이루어지지 않을 때 오는 감정. 기대의 그림자.'},
  {word:'감사',definition:'받은 것에 대해 고마움을 느끼는 것. 행복과 가장 가까운 감정.'},
  {word:'두려움',definition:'위험에 대한 본능적 반응. 살아있다는 증거이자 성장의 장벽.'},
  {word:'용기',definition:'두려움에도 불구하고 행동하는 것. 두려움이 없는 것이 아니다.'},
  {word:'수치심',definition:'자신이 부끄럽게 느껴지는 감정. 타인의 시선을 내면화했을 때 온다.'},
  {word:'자부심',definition:'자신에 대한 긍정적인 평가. 타인의 인정 없이도 스스로 세울 수 있는 것.'},
  {word:'질투',definition:'타인이 가진 것을 원하는 감정. 내가 원하는 것이 무엇인지 알려주는 신호.'},
  {word:'경외',definition:'어마어마한 것 앞에서 느끼는 두려움과 경이로움의 혼합. 자연이나 예술 앞에서.'},
  {word:'연민',definition:'타인의 고통을 함께 느끼는 것. 공감의 가장 깊은 형태.'},
  {word:'혐오',definition:'강한 거부감. 자신이 지키고자 하는 가치가 위협받을 때 나타나기도 한다.'},
  {word:'평온',definition:'흔들림 없이 고요한 상태. 행복보다 더 지속 가능한 감정.'},
  {word:'불안',definition:'원인을 특정하기 어려운 두려움. 미래를 향해 열려있는 마음의 상태.'},
  {word:'황홀',definition:'너무 아름답거나 좋아서 정신이 아득해지는 상태. 감각이 한계에 닿을 때.'},
  {word:'당혹',definition:'예상치 못한 상황에 어쩔 줄 모르는 상태. 준비되지 않은 순간.'},
  {word:'안타깝다',definition:'마음이 쓰이지만 어떻게 할 수 없는 상태. 도울 수 없는 안타까움.'},
  {word:'뿌듯하다',definition:'무언가를 이루었을 때 오는 따뜻한 만족감. 자신에 대한 작은 자랑스러움.'},
  {word:'씁쓸하다',definition:'기쁨과 슬픔이 뒤섞인 복잡한 감정. 달콤하지 않은 현실을 맛볼 때.'},
  {word:'아프다',definition:'몸이나 마음에 고통이 있는 상태. 살아있기 때문에 느낄 수 있는 것.'},
  {word:'따뜻하다',definition:'온기가 느껴지는 상태. 물리적이거나 감정적이거나.'},
  {word:'차갑다',definition:'온기가 없는 상태. 냉담함이나 거리감을 표현할 때도 쓴다.'},
  {word:'포근하다',definition:'따뜻하고 부드러운 것에 감싸인 느낌. 안전하다는 감각의 다른 말.'},
  {word:'서늘하다',definition:'살짝 차갑고 신선한 느낌. 두려움과 쾌감이 동시에 스치는 감각.'},

  // ── 감각·자연 ──
  {word:'노을',definition:'해가 지며 하늘을 물들이는 빛. 하루의 마지막이 가장 아름다운 이유.'},
  {word:'새벽',definition:'밤과 아침 사이의 가장 고요한 시간. 세상이 숨을 고르는 틈.'},
  {word:'안개',definition:'공기 중에 수분이 가득 차 시야가 흐려지는 현상. 경계가 사라지는 시간.'},
  {word:'이슬',definition:'새벽에 풀잎이나 꽃잎에 맺히는 작은 물방울. 짧은 아름다움의 상징.'},
  {word:'바람',definition:'공기의 흐름. 보이지 않지만 느낄 수 있는 것들의 비유.'},
  {word:'침묵',definition:'소리가 없는 상태가 아니라, 말하지 않기로 선택한 상태. 때로는 가장 큰 언어.'},
  {word:'어둠',definition:'빛이 없는 상태. 두려움의 대상이기도, 휴식의 공간이기도 하다.'},
  {word:'빛',definition:'어둠을 밝히는 것. 희망이나 진실의 비유로 오래 쓰여왔다.'},
  {word:'그림자',definition:'빛이 있을 때 생기는 어둠. 존재의 또 다른 면.'},
  {word:'파도',definition:'바다 표면의 물결. 반복되지만 같은 파도는 없다.'},
  {word:'강물',definition:'쉬지 않고 흐르는 물. 시간의 흐름을 닮았다.'},
  {word:'산',definition:'높이 솟은 땅. 오르는 것이 목적이 아니라 과정인 것들의 비유.'},
  {word:'숲',definition:'나무들이 모인 곳. 혼자이면서 함께인 상태.'},
  {word:'꽃',definition:'식물의 생식기관. 아름답지만 짧게 피고 진다.'},
  {word:'낙엽',definition:'가을에 떨어지는 잎. 끝이면서 다음의 준비.'},
  {word:'눈(雪)',definition:'하늘에서 내리는 하얀 결정. 세상을 덮어 고요하게 만드는 것.'},
  {word:'비',definition:'하늘에서 내리는 물. 슬픔이나 씻음의 상징으로 자주 쓰인다.'},
  {word:'천둥',definition:'번개 뒤에 오는 소리. 예고 없이 강하게 오는 것들의 비유.'},
  {word:'무지개',definition:'빗속에 나타나는 일곱 색의 빛. 고난 뒤에 오는 아름다움의 상징.'},
  {word:'달',definition:'밤하늘을 밝히는 위성. 차고 기우는 것들의 상징.'},
  {word:'별',definition:'밤하늘의 빛. 멀리 있어서 더 아름다운 것들의 비유.'},
  {word:'해',definition:'낮을 밝히는 항성. 생명과 에너지의 근원.'},
  {word:'흙',definition:'땅을 이루는 물질. 시작과 끝, 근원의 상징.'},
  {word:'돌',definition:'단단하고 변하지 않는 것. 의지나 고집의 비유.'},
  {word:'물',definition:'흐르고 담기는 것. 유연함과 강함을 동시에 가진 것.'},
  {word:'불',definition:'열과 빛을 내는 현상. 열정이나 파괴의 상징.'},
  {word:'공기',definition:'보이지 않지만 없으면 살 수 없는 것. 당연함의 상징.'},
  {word:'씨앗',definition:'생명의 시작. 작은 것 안에 담긴 무한한 가능성.'},
  {word:'뿌리',definition:'땅속에 숨겨진 나무의 기반. 보이지 않는 곳에서 지탱하는 것들.'},
  {word:'가지',definition:'뿌리와 잎을 연결하는 것. 뻗어나가는 방향성.'},
  {word:'잎',definition:'광합성을 하는 식물의 기관. 계절마다 달라지는 것.'},

  // ── 시간·존재 ──
  {word:'찰나',definition:'순간보다 더 짧은 시간. 번개가 치는 순간처럼, 포착할 수 없이 지나가는 것.'},
  {word:'영원',definition:'끝이 없는 시간. 인간이 가장 원하지만 경험할 수 없는 것.'},
  {word:'순간',definition:'시간의 가장 작은 단위. 그러나 가장 강렬하게 기억되는 것.'},
  {word:'현재',definition:'지금 이 순간. 과거와 미래 사이에서 유일하게 살 수 있는 시간.'},
  {word:'과거',definition:'이미 지나간 시간. 돌아갈 수 없지만 언제든 떠올릴 수 있는 것.'},
  {word:'미래',definition:'아직 오지 않은 시간. 불확실하지만 그래서 가능성이 있는 것.'},
  {word:'존재',definition:'있다는 것. 철학이 수천 년 동안 답을 찾아온 가장 단순한 사실.'},
  {word:'부재',definition:'없다는 것. 있었을 때보다 없어진 뒤에 더 크게 느껴지는 것.'},
  {word:'덧없다',definition:'오래가지 못하고 쉽게 사라지는 것. 꽃이 지는 것처럼, 순간이 가는 것처럼.'},
  {word:'반복',definition:'같은 것이 되풀이되는 것. 습관이 되기도 하고 지루함이 되기도 한다.'},
  {word:'변화',definition:'이전과 달라지는 것. 두려움의 대상이자 희망의 원천.'},
  {word:'지속',definition:'변하지 않고 계속되는 것. 신뢰와 안정의 근거.'},
  {word:'흐름',definition:'멈추지 않고 계속 움직이는 것. 시간도, 물도, 감정도 이렇게 간다.'},
  {word:'끝',definition:'더 이상 나아갈 수 없는 지점. 그러나 대개 새로운 시작의 다른 이름.'},
  {word:'시작',definition:'아직 아무것도 정해지지 않은 순간. 가능성이 가장 넓은 때.'},
  {word:'과정',definition:'시작과 끝 사이의 모든 것. 결과보다 더 많은 것이 담긴 곳.'},
  {word:'결과',definition:'과정이 만들어낸 것. 그러나 언제나 새로운 과정의 시작이기도 하다.'},
  {word:'새로움',definition:'아직 경험하지 못한 것. 두근거림과 불안을 동시에 준다.'},
  {word:'낡음',definition:'오래되어 닳은 상태. 그러나 그 안에 시간의 무게가 담겨있다.'},
  {word:'탄생',definition:'새로운 존재가 세상에 나오는 것. 가장 근원적인 시작.'},
  {word:'죽음',definition:'존재가 끝나는 것. 삶의 반대가 아니라 삶의 일부.'},
  {word:'삶',definition:'태어나서 죽기까지의 모든 것. 의미를 스스로 만들어가는 여정.'},

  // ── 관계·연결 ──
  {word:'연결',definition:'두 개 이상이 이어지는 것. 인간이 근본적으로 원하는 것.'},
  {word:'단절',definition:'이어진 것이 끊어지는 것. 현대인이 가장 두려워하는 것 중 하나.'},
  {word:'관계',definition:'사람 사이에 형성된 것. 만들기도 어렵고 유지하기도 어렵다.'},
  {word:'거리',definition:'물리적 떨어짐. 혹은 마음이 멀어진 정도.'},
  {word:'가까움',definition:'물리적으로나 정서적으로 멀지 않은 상태.'},
  {word:'사랑',definition:'정의할 수 없어서 더 강한 감정. 우리가 살아가는 이유 중 하나.'},
  {word:'이별',definition:'함께하던 것이 떨어지는 것. 만남이 있었기 때문에 가능한 슬픔.'},
  {word:'만남',definition:'두 존재가 처음으로 같은 시공간에 있는 것. 모든 관계의 시작.'},
  {word:'공감',definition:'같은 것을 함께 느끼는 것. 혼자가 아니라는 감각을 주는 것.'},
  {word:'이해',definition:'다른 사람의 세계 안으로 들어가는 것. 완전히는 불가능하지만 시도할 수 있다.'},
  {word:'오해',definition:'다르게 받아들이는 것. 대부분의 갈등이 여기서 시작된다.'},
  {word:'용서',definition:'상처를 내려놓는 것. 상대를 위한 것이 아니라 자신을 위한 것.'},
  {word:'원망',definition:'자신이 받은 상처의 원인을 누군가에게 돌리는 감정.'},
  {word:'믿음',definition:'증거 없이도 확신하는 것. 관계의 가장 단단한 기초.'},
  {word:'의심',definition:'확신하지 못하는 것. 진실을 향한 출발점이기도 하다.'},
  {word:'배려',definition:'상대의 입장을 헤아리는 것. 사랑의 가장 일상적인 표현.'},
  {word:'무관심',definition:'아무런 관심이 없는 상태. 미움보다 더 차가운 것.'},
  {word:'질투',definition:'타인이 가진 것을 원하는 감정. 내가 원하는 것이 무엇인지 알려주는 신호.'},
  {word:'시기',definition:'남이 잘 되는 것을 싫어하는 마음. 자신에 대한 불만의 다른 표현.'},
  {word:'부러움',definition:'다른 사람이 가진 것을 갖고 싶은 마음. 자신의 욕망을 비추는 거울.'},
  {word:'존중',definition:'상대를 중요하게 여기는 것. 관계의 기본 조건.'},
  {word:'무시',definition:'상대를 중요하게 여기지 않는 것. 폭력의 한 형태.'},
  {word:'함께',definition:'혼자가 아닌 상태. 같은 방향을 바라보는 것.'},
  {word:'혼자',definition:'다른 사람 없이 있는 것. 자유이기도 하고 고통이기도 하다.'},
  {word:'약속',definition:'앞으로 어떻게 할지를 서로에게 말하는 것. 신뢰의 계약.'},
  {word:'배신',definition:'약속이나 믿음을 깨는 것. 관계에서 가장 깊은 상처를 남기는 것.'},

  // ── 언어·표현 ──
  {word:'언어',definition:'생각을 소리와 문자로 옮기는 도구. 그러나 항상 부족하다.'},
  {word:'고백',definition:'숨겨온 것을 드러내는 행위. 용기가 필요한 가장 인간적인 언어.'},
  {word:'속삭임',definition:'작은 소리로 말하는 것. 비밀이거나 가까운 거리이거나.'},
  {word:'외침',definition:'크게 소리 지르는 것. 억눌린 것이 터져나오는 방식.'},
  {word:'기록',definition:'남기기 위해 적는 것. 기억이 사라지기 전에 붙잡는 행위.'},
  {word:'이야기',definition:'경험을 언어로 재구성한 것. 인간이 의미를 만드는 방식.'},
  {word:'질문',definition:'모르는 것을 알고자 하는 행위. 대화의 시작이자 사유의 출발.'},
  {word:'대답',definition:'질문에 응하는 것. 책임의 한 형태.'},
  {word:'침묵',definition:'언어가 멈추는 곳. 가장 깊은 것은 말로 표현되지 않는다.'},
  {word:'글',definition:'언어를 문자로 옮긴 것. 시간을 넘어 전달되는 생각.'},
  {word:'시',definition:'언어의 가장 압축된 형태. 산문이 설명하는 것을 시는 보여준다.'},
  {word:'이름',definition:'존재를 구별하기 위해 붙인 것. 불리는 순간 존재가 실재해진다.'},
  {word:'단어',definition:'의미의 최소 단위. 세계를 이해하기 위해 만든 그물.'},
  {word:'문장',definition:'생각을 완결된 형태로 담는 그릇. 잘 만든 문장 하나는 세계를 바꾼다.'},
  {word:'목소리',definition:'각자가 가진 고유한 소리. 존재의 진동.'},
  {word:'메아리',definition:'소리가 반사되어 돌아오는 것. 내가 한 말이 다시 나에게 돌아오는 것.'},

  // ── 사유·철학 ──
  {word:'진실',definition:'실제로 그러한 것. 찾기 어렵고, 받아들이기도 어렵다.'},
  {word:'거짓',definition:'사실이 아닌 것. 때로는 스스로를 지키기 위한 방어이기도 하다.'},
  {word:'의미',definition:'존재나 행위의 이유. 스스로 만들어가는 것.'},
  {word:'무의미',definition:'의미가 없는 상태. 그러나 그것도 하나의 의미가 될 수 있다.'},
  {word:'자유',definition:'스스로 선택할 수 있는 상태. 그러나 책임과 항상 함께 온다.'},
  {word:'책임',definition:'자신의 행동에 대해 답할 수 있는 것. 성숙함의 증거.'},
  {word:'선택',definition:'여러 가능성 중 하나를 고르는 것. 나머지를 포기하는 행위이기도 하다.'},
  {word:'운명',definition:'정해진 것이라고 느껴지는 흐름. 믿는 순간 현실이 되는 것.'},
  {word:'우연',definition:'계획하지 않았는데 일어나는 것. 필연과 우연의 경계는 생각보다 흐릿하다.'},
  {word:'필연',definition:'반드시 그렇게 될 수밖에 없는 것. 모든 것이 연결되어 있다는 믿음.'},
  {word:'가치',definition:'중요하다고 여기는 것. 행동의 방향을 결정한다.'},
  {word:'진리',definition:'시간과 장소를 넘어 언제나 참인 것. 인류가 오래 찾아온 것.'},
  {word:'아름다움',definition:'감각이나 정신을 기쁘게 하는 성질. 정의할 수 없어서 더 강한 것.'},
  {word:'추함',definition:'아름다움의 반대. 그러나 무엇이 추한지는 시대와 문화에 따라 다르다.'},
  {word:'선(善)',definition:'도덕적으로 옳은 것. 그러나 무엇이 선인지는 언제나 논쟁 중이다.'},
  {word:'악(惡)',definition:'도덕적으로 그른 것. 대개 선과 악은 같은 뿌리에서 자란다.'},
  {word:'경계',definition:'두 세계가 만나는 선. 어디까지가 나이고 어디서부터가 너인지를 묻는 곳.'},
  {word:'중심',definition:'모든 것이 그것을 기준으로 돌아가는 지점. 자신의 중심을 찾는 것이 평생의 과제.'},
  {word:'혼돈',definition:'질서가 없는 상태. 그러나 모든 창조는 혼돈에서 시작된다.'},
  {word:'질서',definition:'혼돈이 정리된 상태. 안정을 주지만 때로는 창의성을 막기도 한다.'},
  {word:'균형',definition:'어느 쪽으로도 치우치지 않은 상태. 이상적이지만 항상 흔들린다.'},
  {word:'모순',definition:'서로 반대되는 것이 동시에 참인 상태. 인간 존재의 본질.'},
  {word:'역설',definition:'표면적으로 말이 안 되지만 깊이 생각하면 진실인 것.'},
  {word:'상상',definition:'없는 것을 있게 만드는 마음의 힘. 인간만이 가진 능력.'},
  {word:'현실',definition:'꿈의 반대가 아니라, 꿈이 뿌리내릴 수 있는 땅.'},
  {word:'꿈',definition:'잠 속에서 보이는 것. 혹은 깨어있으면서도 포기하지 않는 바람.'},

  // ── 행위·태도 ──
  {word:'기다리다',definition:'무언가를 원하며 시간을 보내는 것. 사랑의 또 다른 이름.'},
  {word:'머뭇거림',definition:'선택 앞에서 잠시 멈추는 것. 신중함인지 두려움인지 스스로도 모를 때.'},
  {word:'결단',definition:'망설임을 끝내는 것. 하나를 선택함으로써 나머지를 포기하는 행위.'},
  {word:'포기',definition:'더 이상 시도하지 않는 것. 때로는 지혜이고 때로는 도망이다.'},
  {word:'인내',definition:'고통을 견디며 기다리는 것. 시간이 해결해줄 것을 믿는 행위.'},
  {word:'성실',definition:'꾸준히 자신의 자리를 지키는 것. 화려하지 않지만 가장 단단한 것.'},
  {word:'게으름',definition:'움직이지 않으려는 본능. 때로는 재충전이라는 이름을 빌린다.'},
  {word:'놓아주다',definition:'붙잡고 있던 것을 자유롭게 하는 것. 가장 어려운 사랑의 형태.'},
  {word:'붙잡다',definition:'가지 못하게 하는 것. 두려움에서 비롯될 때도, 사랑에서 비롯될 때도 있다.'},
  {word:'나누다',definition:'하나를 여럿이 함께 갖는 것. 기쁨은 나누면 커지고 슬픔은 줄어든다.'},
  {word:'비우다',definition:'가득 찬 것을 내보내는 것. 새로운 것을 받아들이기 위한 준비.'},
  {word:'채우다',definition:'빈 것을 가득 만드는 것. 결핍을 해소하는 행위.'},
  {word:'스며들다',definition:'서서히, 눈치채지 못하게 침투하는 것. 사랑도 슬픔도 이렇게 온다.'},
  {word:'번지다',definition:'한 곳에서 시작해 퍼져나가는 것. 감정이 몸 전체로 퍼질 때.'},
  {word:'물들다',definition:'색이나 감정이 조금씩 흡수되는 것. 오래 함께한 것들이 서로를 닮아가는 방식.'},
  {word:'가라앉다',definition:'아래로 내려가는 것. 감정이 무거워질 때, 생각이 깊어질 때.'},
  {word:'솟구치다',definition:'아래에서 위로 힘차게 올라오는 것. 억눌렸던 것이 터져나올 때.'},
  {word:'맴돌다',definition:'한 곳을 중심으로 계속 돌아다니는 것. 잊히지 않는 생각처럼.'},
  {word:'머물다',definition:'한 곳에 계속 있는 것. 떠나지 않기로 선택한 것.'},
  {word:'떠나다',definition:'있던 곳을 벗어나는 것. 새로운 시작이기도, 이별이기도 하다.'},
  {word:'돌아오다',definition:'떠났다가 다시 오는 것. 기다리는 사람이 있을 때 더 의미있는 것.'},
  {word:'걷다',definition:'두 발로 이동하는 것. 생각을 정리하는 가장 오래된 방법.'},
  {word:'멈추다',definition:'움직임을 끝내는 것. 때로는 가장 용기있는 행동.'},
  {word:'바라보다',definition:'무언가를 향해 시선을 고정하는 것. 주의를 기울이는 행위.'},
  {word:'외면하다',definition:'보이지만 보지 않으려는 것. 불편한 진실 앞에서 자주 일어난다.'},
  {word:'받아들이다',definition:'저항 없이 인정하는 것. 성숙함의 중요한 능력.'},
  {word:'거부하다',definition:'받아들이지 않는 것. 자신을 지키는 행위이기도 하다.'},
  {word:'잊다',definition:'기억에서 사라지는 것. 의도적으로 할 수도, 저절로 일어날 수도 있다.'},
  {word:'기억하다',definition:'지나간 것을 현재로 불러오는 것. 우리가 우리인 이유.'},
  {word:'남기다',definition:'자신이 없어진 뒤에도 존재하도록 하는 것. 우리가 쓰는 이유.'},

  // ── 감각·질감 ──
  {word:'아련하다',definition:'기억이나 감각이 희미하고 멀게 느껴지는 상태. 잡힐 듯 잡히지 않는 아득한 느낌.'},
  {word:'아스라이',definition:'멀고 흐릿하게, 아득하게. 시간이나 거리가 멀어 뚜렷하지 않은 느낌.'},
  {word:'선명하다',definition:'뚜렷하고 명확한 상태. 오히려 지나간 일이 지금보다 더 선명할 때가 있다.'},
  {word:'흐릿하다',definition:'뚜렷하지 않고 불분명한 상태. 시간이 지나면서 기억도 이렇게 된다.'},
  {word:'모호하다',definition:'분명하지 않은 상태. 경계가 흐릿해 어느 쪽인지 알 수 없는 것.'},
  {word:'뚜렷하다',definition:'흐릿함 없이 분명한 상태. 기억이나 형태가 정확히 남아있을 때.'},
  {word:'날카롭다',definition:'예리하게 파고드는 성질. 시선이나 말이 핵심을 찌를 때.'},
  {word:'무디다',definition:'날카롭지 않은 상태. 감각이나 감정이 둔해진 것.'},
  {word:'촉촉하다',definition:'적당히 젖어있는 상태. 건조하지 않은, 생기 있는 감각.'},

const TIMEOUT = 10000;
const WARN_AT = 4000;
let timerInterval = null;
let lastTyped = 0;
let locked = false;
let sessionText = '';
let promptContent = '';
let promptType = '';

function getPrompt() {
  const item = WORD_DB[Math.floor(Math.random() * WORD_DB.length)];
  const showWord = Math.random() < 0.5;
  return { type: showWord ? 'word' : 'def', content: showWord ? item.word : item.definition };
}

function showPrompt() {
  document.getElementById('loading-prompt').style.display = 'none';
  const p = getPrompt();
  promptType = p.type;
  promptContent = p.content;
  const label = document.getElementById('prompt-label');
  const el = document.getElementById('prompt-content');
  if (p.type === 'word') { label.textContent = '오늘의 단어'; el.className = ''; }
  else { label.textContent = '오늘의 정의'; el.className = 'is-def'; }
  el.textContent = p.content;
  el.style.display = 'block';
  enableWriting();
}

function enableWriting() {
  const ta = document.getElementById('note-area');
  ta.disabled = false;
  ta.focus();
  lastTyped = Date.now();
  startCountdown();
}

function startCountdown() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (locked) { clearInterval(timerInterval); return; }
    const elapsed = Date.now() - lastTyped;
    const remaining = Math.max(0, TIMEOUT - elapsed);
    const pct = (remaining / TIMEOUT) * 100;
    const bar = document.getElementById('timer-bar');
    const txt = document.getElementById('timer-text');
    bar.style.width = pct + '%';
    if (remaining <= WARN_AT) { bar.style.background = '#c0392b'; txt.className = 'danger'; txt.textContent = `⚠ ${(remaining/1000).toFixed(1)}초`; }
    else { bar.style.background = 'var(--safe)'; txt.className = ''; txt.textContent = `${(remaining/1000).toFixed(1)}초 남음`; }
    if (remaining <= 0) lockNote();
  }, 100);
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('note-area').addEventListener('input', () => { if (locked) return; lastTyped = Date.now(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
});

function lockNote() {
  if (locked) return;
  locked = true;
  clearInterval(timerInterval);
  sessionText = document.getElementById('note-area').value;
  const flash = document.getElementById('flash');
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 300);
  document.getElementById('note-area').disabled = true;
  setTimeout(() => {
    document.getElementById('writing-screen').style.display = 'none';
    document.getElementById('dead-screen').style.display = 'flex';
    document.getElementById('final-chars').textContent = `총 ${sessionText.length}자 작성됨`;
  }, 400);
}

function savePDF() {
  // 인쇄 페이지 채우기
  document.getElementById('print-label').textContent = promptType === 'word' ? '오늘의 단어' : '오늘의 정의';

  const promptEl = document.getElementById('print-prompt');
  if (promptType === 'word') {
    promptEl.innerHTML = '<div style="font-size:28px; font-weight:700; color:#1a1a18; line-height:1.3;">' + promptContent + '</div>';
  } else {
    promptEl.innerHTML = '<div style="font-size:13px; font-style:italic; color:#3a3a36; line-height:2;">' + promptContent + '</div>';
  }

  document.getElementById('print-body').textContent = sessionText || '(내용 없음)';
  document.getElementById('print-footer').textContent = new Date().toLocaleString('ko-KR') + '  ·  ' + sessionText.length + '자';

  // 인쇄 페이지 보이기
  document.getElementById('print-page').style.display = 'block';

  // 브라우저 인쇄 다이얼로그 (PDF로 저장 선택)
  setTimeout(() => {
    window.print();
    setTimeout(() => {
      document.getElementById('print-page').style.display = 'none';
      document.getElementById('save-confirm').textContent = '✓ 인쇄 창에서 PDF로 저장을 선택하세요';
    }, 500);
  }, 100);
}

function startSession() {
  document.getElementById('intro-screen').style.display = 'none';
  document.getElementById('writing-screen').style.display = 'flex';
  locked = false;
  document.getElementById('note-area').value = '';
  document.getElementById('note-area').disabled = true;
  document.getElementById('loading-prompt').style.display = 'block';
  document.getElementById('prompt-content').style.display = 'none';
  setTimeout(showPrompt, 300);
}

function restart() {
  locked = false; sessionText = '';
  document.getElementById('dead-screen').style.display = 'none';
  document.getElementById('save-confirm').textContent = '';
  document.getElementById('timer-bar').style.width = '100%';
  document.getElementById('timer-bar').style.background = 'var(--safe)';
  document.getElementById('timer-text').textContent = '대기 중';
  document.getElementById('timer-text').className = '';
  document.getElementById('writing-screen').style.display = 'flex';
  document.getElementById('note-area').value = '';
  document.getElementById('note-area').disabled = true;
  document.getElementById('loading-prompt').style.display = 'block';
  document.getElementById('prompt-content').style.display = 'none';
  setTimeout(showPrompt, 300);
}
</script>

<div id="print-page" style="display:none; font-family:'Noto Serif KR',serif; padding:30mm 22mm; color:#1a1a18; background:white;">
  <div style="font-size:8px; color:#b8924a; letter-spacing:4px; text-transform:uppercase; margin-bottom:6px; font-family:monospace;">좋은 글을 쓰고싶어하는 이들을 위한 안내서</div>
  <hr style="border:none; border-top:0.5px solid #b8924a; margin-bottom:16px;">
  <div style="font-size:9px; color:#b8924a; letter-spacing:3px; text-transform:uppercase; margin-bottom:8px; font-family:monospace;" id="print-label"></div>
  <div style="margin-bottom:20px;" id="print-prompt"></div>
  <hr style="border:none; border-top:0.5px solid #d0ccc0; margin-bottom:20px;">
  <div style="font-size:14px; line-height:2.2; white-space:pre-wrap; word-break:break-all;" id="print-body"></div>
  <div style="margin-top:40px; font-size:8px; color:#999; font-family:monospace;" id="print-footer"></div>
</div>
